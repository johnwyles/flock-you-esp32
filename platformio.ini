; ── M5Stack Basic Core v2.7 + M5Launcher ──────────────────────────────────────
; Build firmware for M5Launcher multi-firmware bootloader
; Flash M5Launcher first (see https://github.com/bmorcelli/Launcher), then copy
; .pio/build/m5stack-basic-launcher/firmware.bin to SD:/firmwares/flock-you/
[env:m5stack-basic-launcher]
platform = espressif32@6.7.0
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
upload_speed = 115200

lib_deps =
    m5stack/M5Unified @ ^0.2.2
    h2zero/NimBLE-Arduino@^1.4.3

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DUSE_M5BASIC
    -DENABLE_BLE_SCAN=1
    -DBLE_COEX_MODE=1
    -DFY_M5LAUNCHER=1
    !python generate_build_flags.py

build_src_filter =
    +<main.cpp>
    +<fy_serial.cpp>
    +<fy_gps.cpp>
    +<fy_cc1101.cpp>
    +<fy_webserver.cpp>
    +<storage_select.cpp>
    +<storage_backend.cpp>
    -<beacon_test.cpp>

board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions_4mb.csv
board_build.filesystem = spiffs

; ── M5Stack Basic Core v2.7 (raw image) ────────────────────────────────────────
; Build firmware as a standalone image (no M5Launcher) — use esptool.py to
; flash directly: esptool.py --chip esp32 --baud 115200 write_flash 0x1000
; .pio/build/m5stack-basic-raw/firmware.bin
; Or via PlatformIO: pio run -e m5stack-basic-raw -t upload
